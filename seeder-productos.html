function generarVariantesRopa(tallas, colores, stockPorVariante = 15) {
    const variantes = [];
    for (const talla of tallas) {
        for (const color of colores) {
            variantes.push({ talla, color, stock: stockPorVariante });
        }
    }
    return variantes;
}

function generarVariantesCalzado(tallas, colores, stockPorVariante = 10) {
    const variantes = [];
    for (const talla of tallas) {
        for (const color of colores) {
            variantes.push({ talla, color, stock: stockPorVariante });
        }
    }
    return variantes;
}

function stockTotal(variantes) {
    return variantes.reduce((acc, v) => acc + v.stock, 0);
}

// ── Función principal ────────────────────────────────────────────
async function cargarProductos() {
    const btn = document.getElementById('btnCargar');
    const log = document.getElementById('log');
    const bar = document.getElementById('progressBar');

    btn.disabled = true;
    log.innerHTML = '';

    const total = productos.length;
    let ok = 0;
    let err = 0;

    function escribir(msg, clase) {
        log.innerHTML += `<div class="${clase}">${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    escribir(`▶ Iniciando carga de ${total} productos…`, 'log-info');

    for (let i = 0; i < productos.length; i++) {
        const p = productos[i];
        const variantesValidas = p.variantes.filter(v => v.stock >= 0);
        const stockCalculado   = variantesValidas.reduce((acc, v) => acc + v.stock, 0);

        const doc = {
            nombre:             p.nombre,
            categoria:          p.categoria,
            talla:              p.tallasDisponibles[0] || 'Unica',
            tallasDisponibles:  p.tallasDisponibles,
            coloresDisponibles: p.coloresDisponibles,
            variantes:          variantesValidas,
            stock:              stockCalculado,
            imagenUrl:          p.imagenUrl || '',
            precio:             p.precio,
            fecha:              new Date()
        };

        try {
            await db.collection('productos').add(doc);
            ok++;
            escribir(`✔ [${i + 1}/${total}] ${p.nombre} (${p.categoria})`, 'log-ok');
        } catch (e) {
            err++;
            escribir(`✖ [${i + 1}/${total}] Error en "${p.nombre}": ${e.message}`, 'log-err');
        }

        bar.style.width = `${Math.round(((i + 1) / total) * 100)}%`;
        // Pequeña pausa para no saturar Firestore
        await new Promise(r => setTimeout(r, 150));
    }

    escribir('', '');
    if (err === 0) {
        escribir(`✅ ¡Listo! ${ok} productos cargados correctamente.`, 'log-info');
    } else {
        escribir(`⚠ Carga completada: ${ok} correctos, ${err} con error.`, 'log-err');
    }

    btn.textContent  = '✅ Carga completada';
    btn.style.background = '#4caf7d';
}
</script>

</body>
</html>
