<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modaveli - Almacén</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.2.11/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@5.2.8/index.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #080808;
            --surface: #111111;
            --surface-2: #181818;
            --border: #242424;
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --text: #f0ece4;
            --muted: #6b6560;
            --danger: #c94c4c;
            --success: #4ca874;
            --warning: #c9914c;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            height: 60px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand { display: flex; align-items: baseline; gap: 1rem; }
        .navbar-brand .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: var(--gold);
        }
        .navbar-brand .section-tag {
            font-size: 0.6rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 0.2rem 0.6rem;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

        .main {
            display: grid;
            grid-template-columns: 420px 1fr;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* ── PANEL FORMULARIO ── */
        .form-panel {
            border-right: 1px solid var(--border);
            padding: 2rem 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .panel-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--text);
        }
        .panel-subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: -0.8rem;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label {
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .form-group input,
        .form-group select {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            padding: 0.7rem 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }
        .form-group input:focus,
        .form-group select:focus { border-color: var(--gold); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .input-price-wrapper { position: relative; }
        .input-price-wrapper input { padding-right: 2.5rem; }
        .input-price-wrapper::after {
            content: '€';
            position: absolute;
            right: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* ── VARIANTES ── */
        .variant-box {
            border: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .variant-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .size-selector-row { display: flex; gap: 0.5rem; }
        .size-selector-row select { flex: 1; }

        .btn-add-size {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-add-size:hover { background: rgba(201,168,76,0.1); }
        .btn-add-size:disabled { opacity: 0.35; cursor: not-allowed; }

        .selected-sizes { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 1.5rem; }
        .size-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(201,168,76,0.08);
            border: 1px solid rgba(201,168,76,0.3);
            color: var(--gold);
            font-size: 0.72rem;
            padding: 0.2rem 0.5rem;
        }
        .btn-remove-size {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0;
            line-height: 1;
        }
        .btn-remove-size:hover { color: var(--danger); }

        .size-help { font-size: 0.7rem; color: var(--muted); }

        .btn-generate {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.6rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-generate:hover { border-color: var(--gold); color: var(--gold); }

        .variants-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .variants-table th {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0.5rem 0.4rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-weight: 400;
        }
        .variants-table td { padding: 0.5rem 0.4rem; border-bottom: 1px solid rgba(36,36,36,0.4); }
        .input-stock-variante {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            padding: 0.35rem 0.5rem;
            width: 70px;
            outline: none;
        }
        .input-stock-variante:focus { border-color: var(--gold); }
        .btn-del-variant {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0.2rem 0.4rem;
        }
        .btn-del-variant:hover { color: var(--danger); }

        #btnGuardar {
            background: var(--gold);
            border: none;
            color: #080808;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 0.9rem 1.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: auto;
        }
        #btnGuardar:hover { opacity: 0.85; }
        #btnGuardar:disabled { opacity: 0.4; cursor: not-allowed; }
        #btnGuardar.btn-success { background: var(--success); color: #fff; }

        /* ── PANEL TABLA ── */
        .table-panel {
            padding: 2rem 2.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.2rem;
        }
        .table-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 300;
        }

        /* ── FILTROS ── */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: flex-end;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1rem 1.2rem;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .filter-group label {
            font-size: 0.6rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .filter-bar select,
        .filter-bar input[type="text"] {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            padding: 0.45rem 0.7rem;
            outline: none;
            min-width: 120px;
            transition: border-color 0.2s;
        }
        .filter-bar select:focus,
        .filter-bar input[type="text"]:focus { border-color: var(--gold); }
        .filter-bar input[type="text"] { min-width: 190px; }

        .filter-footer {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-left: auto;
        }
        #btnLimpiarFiltros {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.45rem 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        #btnLimpiarFiltros:hover { border-color: var(--gold); color: var(--gold); }
        #contadorProductos {
            font-size: 0.75rem;
            color: var(--gold);
            white-space: nowrap;
            letter-spacing: 0.05em;
        }

        table { width: 100%; border-collapse: collapse; }
        thead tr { border-bottom: 1px solid var(--border); }
        thead th {
            font-size: 0.62rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0.75rem 1rem;
            text-align: left;
            font-weight: 400;
        }
        tbody tr { border-bottom: 1px solid rgba(36,36,36,0.6); transition: background 0.15s; }
        tbody tr:hover { background: rgba(201,168,76,0.03); }
        tbody td { padding: 1rem; font-size: 0.88rem; font-weight: 300; }

        tbody td strong {
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            color: var(--gold);
        }

        .btn-warning { background: transparent !important; border: 1px solid #c9914c !important; color: #c9914c !important; font-size: 0.75rem; padding: 0.3rem 0.65rem; cursor: pointer; border-radius: 0; margin-right: 0.3rem; }
        .btn-danger  { background: transparent !important; border: 1px solid #c94c4c !important; color: #c94c4c !important; font-size: 0.75rem; padding: 0.3rem 0.65rem; cursor: pointer; border-radius: 0; }
        .btn-warning:hover { background: rgba(201,145,76,0.1) !important; }
        .btn-danger:hover  { background: rgba(201,76,76,0.1) !important; }

        .badge { display: inline-block; padding: 0.2rem 0.65rem; font-size: 0.7rem; font-weight: 500; background: rgba(201,168,76,0.12); color: var(--gold); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        @media (max-width: 1100px) {
            .main { grid-template-columns: 1fr; height: auto; }
            .form-panel { border-right: none; border-bottom: 1px solid var(--border); }
            .variant-row, .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <span class="logo">Modaveli</span>
            <span class="section-tag">Almacén</span>
        </div>
        <button id="btnCerrarSesion" class="btn-logout">Salir →</button>
    </nav>

    <div class="main">

        <!-- FORMULARIO -->
        <aside class="form-panel">
            <h2 class="panel-title">Nuevo Producto</h2>
            <p class="panel-subtitle">Inventario</p>

            <div class="form-group">
                <label>Nombre del producto</label>
                <input type="text" id="txtNombre" placeholder="Ej: Camiseta básica negra">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="cmbCategoria">
                        <option value="" disabled selected>Seleccionar…</option>
                        <option value="Camisetas">Camisetas</option>
                        <option value="Pantalones">Pantalones</option>
                        <option value="Sudaderas">Sudaderas</option>
                        <option value="Zapatos">Zapatillas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>URL de imagen</label>
                    <input type="text" id="txtImagen" placeholder="https://…">
                </div>
            </div>

            <div class="form-group">
                <label>Precio de venta</label>
                <div class="input-price-wrapper">
                    <input type="number" id="txtPrecio" placeholder="0.00" min="0" step="0.01">
                </div>
            </div>

            <section class="variant-box">
                <div class="variant-row">
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Tallas</label>
                        <div class="size-selector-row">
                            <select id="cmbTallaSimple"></select>
                            <button type="button" id="btnAgregarTalla" class="btn-add-size">Anadir talla</button>
                        </div>
                        <div id="listaTallasSeleccionadas" class="selected-sizes"></div>
                        <p class="size-help">Elige una talla y pulsa "Anadir talla".</p>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Colores (separados por coma)</label>
                        <input type="text" id="txtColores" placeholder="Negro, Blanco, Azul">
                    </div>
                </div>

                <button type="button" id="btnGenerarVariantes" class="btn-generate">Generar combinaciones talla-color</button>

                <table class="variants-table">
                    <thead>
                        <tr>
                            <th>Talla</th>
                            <th>Color</th>
                            <th>Stock</th>
                            <th>Accion</th>
                        </tr>
                    </thead>
                    <tbody id="tablaVariantes"></tbody>
                </table>
            </section>

            <button id="btnGuardar">Guardar producto</button>
        </aside>

        <!-- TABLA -->
        <section class="table-panel">
            <div class="table-header">
                <h2 class="table-title">Catálogo</h2>
            </div>

            <!-- FILTROS -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label>Categoría</label>
                    <select id="filtroCat">
                        <option value="">Todas</option>
                        <option value="Camisetas">Camisetas</option>
                        <option value="Pantalones">Pantalones</option>
                        <option value="Sudaderas">Sudaderas</option>
                        <option value="Zapatos">Zapatos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Talla</label>
                    <select id="filtroTalla">
                        <option value="">Todas</option>
                        <option>XS</option><option>S</option><option>M</option>
                        <option>L</option><option>XL</option><option>XXL</option>
                        <option>38</option><option>39</option><option>40</option>
                        <option>41</option><option>42</option><option>43</option><option>44</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Stock</label>
                    <select id="filtroStock">
                        <option value="">Todos</option>
                        <option value="con">Con stock</option>
                        <option value="sin">Sin stock</option>
                        <option value="critico">Crítico (≤5)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Buscar</label>
                    <input type="text" id="filtroBuscar" placeholder="Buscar producto…">
                </div>
                <div class="filter-footer">
                    <button id="btnLimpiarFiltros">Limpiar</button>
                    <span id="contadorProductos">0 productos</span>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Talla</th>
                        <th>Stock</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos"></tbody>
            </table>
        </section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script type="module" src="../js/almacen.js"></script>
</body>
</html>
