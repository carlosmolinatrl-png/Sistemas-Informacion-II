<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modaveli - Ventas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.2.11/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@5.2.8/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-mono@5.2.7/index.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #080808;
            --surface: #111111;
            --surface-2: #181818;
            --border: #242424;
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --text: #f0ece4;
            --muted: #6b6560;
            --danger: #c94c4c;
            --success: #4ca874;
            --warning: #c9914c;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, .brand {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        /* --- NAVBAR --- */
        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar .brand { font-size: 1.5rem; color: var(--gold); text-transform: uppercase; }

        /* --- BOTONES --- */
        .btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .btn:hover { border-color: var(--gold); color: var(--gold); }
        .btn-gold {
            background: var(--gold);
            color: #080808;
            border-color: var(--gold);
            font-weight: 600;
        }
        .btn-gold:hover { opacity: 0.85; color: #080808; }
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: rgba(201,76,76,0.1); color: var(--danger); }
        .btn-outline { border-color: var(--border); color: var(--muted); }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

        /* --- LAYOUT --- */
        .container {
            display: grid;
            grid-template-columns: 300px 1fr 280px;
            gap: 1.5rem;
            padding: 1.5rem;
            flex: 1;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .panel-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        /* --- FORMULARIO --- */
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
        }
        input, select {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 0.8rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }
        input:focus, select:focus { border-color: var(--gold); }

        /* --- FILTROS INVENTARIO --- */
        .filter-bar {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.8rem;
        }
        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .filter-group-v {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .filter-group-v label {
            font-size: 0.58rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .filter-bar select,
        .filter-bar input[type="text"] {
            font-size: 0.78rem;
            padding: 0.4rem 0.55rem;
        }
        .filter-bar-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #btnLimpiarFiltrosV {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.3rem 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        #btnLimpiarFiltrosV:hover { border-color: var(--gold); color: var(--gold); }
        #contadorInventario {
            font-size: 0.72rem;
            color: var(--gold);
            letter-spacing: 0.04em;
        }

        /* --- TABLAS --- */
        .table-wrapper { overflow-x: auto; flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 1rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); }
        td { font-family: 'DM Mono', monospace; }

        .td-name  { font-family: 'DM Sans', sans-serif; font-size: 1rem; color: var(--text); }
        .td-cat   { font-size: 0.75rem; color: var(--muted); display: block; margin-top: 0.2rem; }
        .td-precio { color: var(--gold); font-weight: 500; }
        .td-hora  { font-size: 0.8rem; color: var(--muted); }
        .td-qty   { color: var(--gold); font-weight: bold; }

        .status-ok  { color: var(--success); }
        .status-low { color: var(--danger); }

        /* --- MENSAJES --- */
        #mensajeVenta {
            font-size: 0.85rem;
            text-align: center;
            font-family: 'DM Mono', monospace;
            min-height: 1.2rem;
        }
        .msg-success { color: var(--success); }
        .msg-error   { color: var(--danger); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">Caja Registradora</div>
        <button id="btnCerrarSesion" class="btn btn-danger">Cerrar Sesión</button>
    </nav>

    <div class="container">

        <!-- PANEL NUEVA VENTA -->
        <div class="panel">
            <h2 class="panel-title">Nueva Venta</h2>
            <div class="form-group">
                <label>Producto</label>
                <select id="cmbProductoVenta"></select>
            </div>
            <div class="form-group">
                <label>Cantidad</label>
                <input type="number" id="txtCantidadVenta" value="1" min="1">
            </div>
            <button id="btnVender" class="btn btn-gold" style="margin-top: 1rem; padding: 1rem;">Confirmar Transacción</button>
            <div id="mensajeVenta"></div>
        </div>

        <!-- PANEL INVENTARIO CON FILTROS -->
        <div class="panel">
            <h2 class="panel-title">Inventario</h2>

            <!-- FILTROS -->
            <div class="filter-bar">
                <div class="filter-row">
                    <div class="filter-group-v">
                        <label>Categoría</label>
                        <select id="filtroCatV">
                            <option value="">Todas</option>
                            <option value="Camisetas">Camisetas</option>
                            <option value="Pantalones">Pantalones</option>
                            <option value="Sudaderas">Sudaderas</option>
                            <option value="Zapatos">Zapatos</option>
                        </select>
                    </div>
                    <div class="filter-group-v">
                        <label>Talla</label>
                        <select id="filtroTallaV">
                            <option value="">Todas</option>
                            <option>XS</option><option>S</option><option>M</option>
                            <option>L</option><option>XL</option><option>XXL</option>
                            <option>38</option><option>39</option><option>40</option>
                            <option>41</option><option>42</option><option>43</option><option>44</option>
                        </select>
                    </div>
                </div>
                <div class="filter-row">
                    <div class="filter-group-v">
                        <label>Stock</label>
                        <select id="filtroStockV">
                            <option value="">Todos</option>
                            <option value="con">Con stock</option>
                            <option value="sin">Sin stock</option>
                            <option value="critico">Crítico (≤5)</option>
                        </select>
                    </div>
                    <div class="filter-group-v">
                        <label>Buscar</label>
                        <input type="text" id="filtroBuscarV" placeholder="Buscar…">
                    </div>
                </div>
                <div class="filter-bar-footer">
                    <button id="btnLimpiarFiltrosV">Limpiar</button>
                    <span id="contadorInventario">0 artículos</span>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Artículo</th>
                            <th>Talla</th>
                            <th>Stock</th>
                            <th>Precio</th>
                        </tr>
                    </thead>
                    <tbody id="tablaVentas"></tbody>
                </table>
            </div>
        </div>

        <!-- PANEL ÚLTIMAS VENTAS -->
        <div class="panel">
            <h2 class="panel-title">Últimas 5 Ventas</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Pedido</th>
                            <th>Pack</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorial"></tbody>
                </table>
            </div>
            <button id="btnVerHistorial" class="btn btn-outline" style="width: 100%; margin-top: auto;">Ver Historial Completo</button>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script type="module" src="../js/ventas.js"></script>
</body>
</html>
